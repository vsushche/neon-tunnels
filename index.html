<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunnels of Armageddon - Browser Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- Game Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Flash Effect Overlay -->
        <div id="flash-overlay"></div>

        <!-- UI HUD -->
        <div id="hud">
            <div class="hud-panel">
                <div class="hud-label">SPEED</div>
                <div class="hud-value" id="ui-speed">0</div>
                <div class="hud-bar-bg"><div class="hud-bar-fill" id="ui-speed-bar"></div></div>
            </div>
            
            <div class="hud-panel center-panel">
                <div class="hud-label">LEVEL</div>
                <div class="hud-value level-value" id="ui-level">1</div>
            </div>

            <div class="hud-panel">
                <div class="hud-label">TIME</div>
                <div class="hud-value" id="ui-time">0.00s</div>
                <div class="hud-label hud-label-progress">PROGRESS</div>
                <div class="hud-bar-bg"><div class="hud-bar-fill" id="ui-progress-bar"></div></div>
            </div>
        </div>
        
        <!-- Start / Game Over Screen -->
        <div id="menu-screen" class="glass-panel">
            <h1 id="menu-title">NEON TUNNELS</h1>
            <p id="menu-desc">
                <span class="key-group" aria-label="Arrow keys">
                    <kbd>&uarr;</kbd><kbd>&larr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd>
                </span>
                to Move.<br>
                <kbd>Space</kbd> to Accelerate, <kbd>Left Alt</kbd> to Brake, <kbd>X</kbd> to Fire.<br>
                Dodge the walls and shoot sensor gates open.
            </p>
            <button id="start-btn">START</button>
        </div>
    </div>

    <script src="main.js" type="module"></script>
</body>
</html>
